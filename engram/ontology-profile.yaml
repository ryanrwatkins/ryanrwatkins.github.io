id: research-map
version: 1
default_language: en

node_types:
  Paper:
    aliases: [article, publication]
    registry: research
    visual_encoding:
      shape: box
      color_hex: "#1d5f74"
  Concept:
    aliases: [idea, theme]
    visual_encoding:
      shape: dot
      color_hex: "#3d7d52"
  Method:
    aliases: [methodology, approach]
    visual_encoding:
      shape: diamond
      color_hex: "#9a6700"
  Technology:
    aliases: [tool, system]
    visual_encoding:
      shape: hexagon
      color_hex: "#7c3f8c"
  Domain:
    aliases: [field, discipline]
    visual_encoding:
      shape: square
      color_hex: "#9c3b3b"
  Author:
    aliases: [researcher, scholar]
    visual_encoding:
      shape: triangle
      color_hex: "#52606d"

relation_types:
  discusses:
    source: Paper
    target: Concept
  applies_method:
    source: Paper
    target: Method
  uses_technology:
    source: Paper
    target: Technology
  situated_in:
    source: Paper
    target: Domain
  authored_by:
    source: Paper
    target: Author
  related_to:
    source: [Paper, Concept, Method, Technology, Domain]
    target: [Paper, Concept, Method, Technology, Domain]

registries:
  research:
    source: research
    id_column: id
    label_column: title
    alias_columns: [doi, zotero_key]
    node_type: Paper

citation_policy:
  minimum_granularity: file
  require_source_file: true
  allow_bbox: when_available

hardening:
  statuses: [candidate, attached, needs_review, validated, rejected, superseded]
  default_status: candidate

outputs:
  ontology:
    enabled: true
    canonical_node_types: [Paper, Concept, Method, Technology, Domain, Author]
    relation_exports: [discusses, applies_method, uses_technology, situated_in, authored_by, related_to]
    wiki:
      enabled: false
      page_node_types: [Paper]
